name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: warning
        env:
          SHELLCHECK_OPTS: --source-path=lib

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bats
        uses: bats-core/bats-action@4.0.0

      - name: Run tests
        run: bats test/

  python:
    name: Python (ruff + compileall)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install ruff (pinned to match local gate)
        run: pip install "ruff==0.16.4"

      - name: Ruff check
        run: ruff check

      - name: Byte-compile shipped Python
        run: python -m compileall git_auto_switch/

  node:
    name: Node (syntax + pack)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Syntax-check shipped JS
        run: |
          node --check index.js
          node --check bin/git-auto-switch.js

      - name: Dry-run npm pack
        run: npm pack --dry-run

  lockfile:
    name: Lockfile freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # A stale package-lock.json fails this job: npm ci refuses to run when
      # the lockfile and package.json disagree, and the regenerated lockfile
      # must be byte-identical to the committed one.
      - name: Verify package-lock.json is in sync
        run: npm ci --dry-run --ignore-scripts

      - name: Fail on lockfile drift
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install coverage tools
        run: pip install pytest pytest-cov

      - name: Python coverage (M3 baseline in COVERAGE.md)
        run: python -m pytest --cov=git_auto_switch --cov-report=term-missing --cov-report=xml tests/

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned binary, verified against upstream's published SHA256 before
      # it runs — the same download-then-verify posture as install-curl.sh.
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          version="8.30.1"
          asset="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSL "${base}/${asset}" -o "$asset"
          curl -fsSL "${base}/gitleaks_${version}_checksums.txt" -o checksums.txt
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks

      - name: Scan git history for secrets
        run: ./gitleaks git --redact --verbose .
