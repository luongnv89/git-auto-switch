<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Simplified favicon: git node with switch arrows -->
  <rect width="16" height="16" rx="3" fill="#0A0A0A"/>

  <!-- Central node -->
  <circle cx="8" cy="8" r="2" fill="#22C55E"/>
  <circle cx="8" cy="8" r="1" fill="#0A0A0A"/>

  <!-- Top node -->
  <circle cx="8" cy="3.5" r="1.2" fill="#FFFFFF"/>

  <!-- Bottom node -->
  <circle cx="8" cy="12.5" r="1.2" fill="#FFFFFF"/>

  <!-- Vertical lines -->
  <line x1="8" y1="4.7" x2="8" y2="6" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="8" y1="10" x2="8" y2="11.3" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Right arrow hint -->
  <path d="M 10 4.5 Q 12.5 4.5 12.5 7 L 10.5 7" fill="none" stroke="#22C55E" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Left arrow hint -->
  <path d="M 6 11.5 Q 3.5 11.5 3.5 9 L 5.5 9" fill="none" stroke="#22C55E" stroke-width="0.8" stroke-linecap="round"/>
</svg>